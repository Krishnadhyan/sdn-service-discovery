name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Pillow pytest ruff

    - name: Lint with ruff
      run: |
        ruff check . --select=E9,F63,F7,F82 --show-source
      continue-on-error: true

    - name: Run Registry Unit Tests
      run: |
        python -m unittest discover -s registry/tests -v

    - name: Run Client and Frontend Bridge Unit Tests
      run: |
        python -m unittest discover -s tests -v

    - name: Run Benchmark Unit Tests
      run: |
        python -m unittest discover -s benchmark/tests -v

    - name: Run Provider Unit Tests
      run: |
        python -m unittest discover -s providers/tests -v

